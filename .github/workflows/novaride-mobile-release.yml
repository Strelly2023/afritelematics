name: NovaRide Mobile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "2026.1.1"
  push:
    tags:
      - "novaride-mobile-v*"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version and host gates
        run: |
          python3 scripts/mobile/assert_version_increment.py
          python3 scripts/mobile/assert_no_stale_api_hosts.py
          python3 scripts/mobile/verify_release_manifest.py

  typecheck:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rider typecheck
        working-directory: rider_app
        run: npm ci && npm run typecheck
      - name: Driver typecheck
        working-directory: driver_app
        run: npm ci && npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mobile release tests
        run: python3 -m pytest -q tests/mobile_release rider_app/tests driver_app/tests

  contract-tests:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: API contract preflight
        run: python3 scripts/mobile/verify_novaride_api_contract.py

  android-build:
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, contract-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Rider APK
        working-directory: rider_app/android
        run: ./gradlew clean assembleRelease
      - name: Build Driver APK
        working-directory: driver_app/android
        run: ./gradlew clean assembleRelease

  apk-validation:
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4
      - name: Validate APK scripts are present
        run: |
          test -x scripts/mobile/verify_apk_artifact.sh || chmod +x scripts/mobile/verify_apk_artifact.sh
          test -f scripts/mobile/verify_public_apk_release.py

  signing-validation:
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4
      - name: Materialize signing keystore
        env:
          AFRIRIDE_ANDROID_KEYSTORE_BASE64: ${{ secrets.AFRIRIDE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          export AFRIRIDE_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/novaride-release-keystore.jks"
          scripts/mobile/materialize_android_keystore.sh "$AFRIRIDE_ANDROID_KEYSTORE_PATH"
          echo "AFRIRIDE_ANDROID_KEYSTORE_PATH=$AFRIRIDE_ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Verify signing credentials
        env:
          AFRIRIDE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AFRIRIDE_ANDROID_KEYSTORE_PASSWORD }}
          AFRIRIDE_ANDROID_KEY_ALIAS: ${{ secrets.AFRIRIDE_ANDROID_KEY_ALIAS }}
          AFRIRIDE_ANDROID_KEY_PASSWORD: ${{ secrets.AFRIRIDE_ANDROID_KEY_PASSWORD }}
          SIGNING_SECRET_PROVIDER: github-actions
        run: scripts/mobile/verify_release_signing_credentials.sh

  publication-staging:
    runs-on: ubuntu-latest
    needs: [apk-validation, signing-validation]
    environment: mobile-public-pilot-staging
    steps:
      - uses: actions/checkout@v4
      - name: Stage publication
        run: echo "stage immutable artifacts"

  public-url-validation:
    runs-on: ubuntu-latest
    needs: publication-staging
    steps:
      - uses: actions/checkout@v4
      - name: Public URL validation
        run: echo "verify static APK URLs before production approval"

  release-approval:
    runs-on: ubuntu-latest
    needs: public-url-validation
    environment: mobile-public-pilot-production
    steps:
      - run: echo "manual approval required by protected environment"

  publication-production:
    runs-on: ubuntu-latest
    needs: release-approval
    environment: mobile-public-pilot-production
    steps:
      - uses: actions/checkout@v4
      - name: Publish production
        run: echo "publish immutable APKs after approval"

  post-publication-smoke-test:
    runs-on: ubuntu-latest
    needs: publication-production
    steps:
      - run: echo "run post-publication smoke test checklist"

  release-report:
    runs-on: ubuntu-latest
    needs: post-publication-smoke-test
    steps:
      - uses: actions/checkout@v4
      - name: Generate release audit report
        run: python3 scripts/mobile/generate_release_audit_report.py
