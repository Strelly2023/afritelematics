name: API Startup Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-startup:
    name: Import application and register production routes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify application startup imports and critical routes
        run: |
          python - <<'PY'
          from afritech.api.app import app

          routes = {
              (method, route.path)
              for route in app.routes
              for method in getattr(route, "methods", set())
          }
          required_routes = {
              ("GET", "/health"),
              ("GET", "/v1/driver/{driver_id}/availability"),
              ("POST", "/v1/driver/{driver_id}/availability"),
          }
          missing = sorted(required_routes - routes)
          if missing:
              raise SystemExit(f"Missing critical API routes: {missing}")

          print("Application import and critical route registration succeeded.")
          PY
