name: Fast CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  impact:
    name: Impact-selected validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            rider_app/package-lock.json
            driver_app/package-lock.json
            dashboard/package-lock.json

      - name: Cache tooling directories
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            ~/.cache/mypy
            ~/.cache/ruff
            ~/.expo
            ~/.cache/expo
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/buildx
            ~/.docker/buildx
          key: ci-tools-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml', 'package-lock.json', 'rider_app/package-lock.json', 'driver_app/package-lock.json', 'dashboard/package-lock.json') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: |
          npm --prefix rider_app ci
          npm --prefix driver_app ci
          npm --prefix dashboard ci

      - name: Analyze impact
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="origin/main"
          else
            BASE_REF="origin/$BASE_REF"
          fi
          python -m afritech.ci.impact --base "$BASE_REF" --head HEAD --json

      - name: Compile and lint
        run: |
          python -m compileall afritech afriride_system
          ruff check afritech afriride_system

      - name: Governance gate
        run: |
          python -m afritech.ci.four_gate_validator
          python -m afritech.guards.guard_runtime_boundary_governance --fail-on-drift
          python -m afritech.ci.secret_scan
          python -m afritech.ci.docs_link_validator

      - name: Run selected CI suites
        run: |
          python -m afritech.ci.run_selected_tests --plan ci_artifacts/impact_plan.json

      - name: Git diff check
        run: git diff --check
