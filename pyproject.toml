# =============================================================================
# BUILD SYSTEM
# =============================================================================

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


# =============================================================================
# PROJECT METADATA
# =============================================================================

[project]
name = "afritech"
version = "0.1.0"
description = "AfriTech constitutional execution and replay verification system"
requires-python = ">=3.10"

dependencies = [
    "django",
    "djangorestframework",
    "fastapi",
    "starlette>=1.3.1",
    "GitPython>=3.1.55",
    "httpx",
    "pydantic",
    "psycopg[binary]",
    "redis",
    "stripe",
    "cryptography",
    "webauthn>=3.0.0,<4",
    "PyNaCl",
    "web3",
    "hexbytes",
    "eth-typing",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "jsonschema>=4.23.0",
    "PyYAML>=6.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    "opentelemetry-instrumentation-requests>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
]


[project.scripts]
afritech = "afritech.cli.main:main"
afritech-verify = "afritech.tools.external_verifier_cli:run"
afritech-verify-session = "afritech.tools.partner_verification_session_cli:run"
novapay-verify = "afritech.tools.novapay_verify_cli:run"
novaride-verify = "afritech.tools.novaride_verify_cli:run"
novatrust-verify = "afritech.tools.novatrust_verifier_cli:run"
novacodepro = "afritech.tools.novacodepro_cli:main"
architecture-validate = "architecture_validator.cli:main"
architecture-self-heal = "architecture_validator.remediation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "mutmut",
]


# =============================================================================
# PACKAGE DISCOVERY
# =============================================================================

[tool.setuptools.packages.find]
where = ["."]
include = [
    "afritech*",
    "ecosystems*",
    "afriride_system*",
    "architecture_validator*",
    "services*",
    "contracts*"
]

[tool.setuptools.package-data]
afritech = [
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.sql",
]
contracts = ["*.json"]


# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================

[tool.coverage.run]
branch = true

# ✅ ONLY TEST AFRIPOWER + VALIDATOR
source = [ 
    "afritech.afripower",
    "afritech.ci.afripower_intelligence_validator",
]


[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
precision = 2

exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "if TYPE_CHECKING:",
]

omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
    "*/site-packages/*",
]


[tool.coverage.html]
directory = "coverage_html"

[tool.coverage.xml]
output = "coverage.xml"


# =============================================================================
# MUTATION TESTING
# =============================================================================

[tool.mutmut]

paths_to_mutate = [
    "afritech/afripower/",
    "afritech/ci/afripower_intelligence_validator.py",
]

tests_dir = "tests"

# ✅ CRITICAL: disable django plugin
runner = "pytest -q -p no:django"

use_coverage = true
max_stack_depth = 10


# =============================================================================
# OPTIONAL STRICTNESS
# =============================================================================

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
ignore = []
