      AFRITECH_AGENT_STATE_PATH: /var/lib/afritech/agents/production.sqlite3
      AFRITECH_ALLOW_PILOT_TOKEN_ISSUANCE: "false"
      AFRITECH_AUTH_BOOTSTRAP_SECRET: replace-only-if-controlled-bootstrap-is-required
      AFRITECH_CHAIN_ADDRESS_CHECKSUM: 0xYOUR_FUNDED_PUBLIC_LEDGER_WALLET
