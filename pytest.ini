[pytest]

DJANGO_SETTINGS_MODULE = afriride_system.django_app.config.settings
python_files = tests.py test_*.py *_tests.py
pythonpath = .

# ✅ CRITICAL: disable Django plugin for AFRIPower tests
addopts =
    --strict-markers
    --disable-warnings
    --maxfail=1
    -p no:django

markers =
    fast: quick developer feedback tests
    unit: unit-level tests
    integration: integration-level tests
    contract: contract and interface tests
    governance: governance and boundary tests
    private_dev: local-only developer validation for mock users, simulated payments, and sandbox identity flows
    simulated_payment: tests that exercise simulated payment providers only
    no_live_charge: tests that assert real charging is disabled
    local_only: tests that must not require networked production services
    slow: slow-running tests
    mobile: mobile-app tests
    novaride: NovaRide domain tests
    novapay: NovaPay domain tests
    novaid: NovaID domain tests
    rider: rider app tests
    driver: driver app tests
    operator: operator app tests
    consumer: NovaPay consumer tests
    agent: NovaPay agent tests
    merchant: NovaPay merchant tests
    business: NovaPay business tests
    identity: identity and authentication tests
    release_guard: release boundary and production safety tests
    apk: APK packaging and distribution tests
    smoke: fast smoke checks for private-dev and pilot readiness
    internal_qa: internal QA validation for sandbox-only QA builds
    qa_smoke: fast internal QA smoke checks
    qa_regression: internal QA regression checks
    qa_mobile: internal QA mobile-app checks
    qa_api: internal QA API contract checks
    qa_security: internal QA security checks
    qa_release_guard: internal QA release boundary and production safety tests
    qa_apk: internal QA APK packaging and distribution tests
    qa_icons: internal QA icon validation tests
    qa_button_registry: internal QA tab and button registry tests
    controlled_pilot: controlled pilot validation after internal QA and before GA
    pilot_smoke: fast controlled pilot smoke checks
    pilot_mobile: controlled pilot mobile-app checks
    pilot_api: controlled pilot API contract checks
    pilot_security: controlled pilot security checks
    pilot_release_guard: controlled pilot release boundary and production safety checks
    pilot_apk: controlled pilot APK packaging and distribution checks
    pilot_access_control: controlled pilot access-control checks
    pilot_device_control: controlled pilot device-control checks
    pilot_payment_guard: controlled pilot payment boundary checks
    approved_users_only: tests that assert only approved pilot users can access pilot surfaces
    approved_devices_only: tests that assert only approved pilot devices can access pilot surfaces
    public_pilot: public pilot validation after controlled pilot and before PRR
    pilot_real_limited: public pilot tests for limited real payment mode
    public_pilot_guard: public pilot governance and release guard tests
    public_pilot_payments: public pilot payment guard and reconciliation tests
    public_pilot_identity: public pilot identity and onboarding tests
    public_pilot_monitoring: public pilot observability and monitoring tests
    public_pilot_incident_response: public pilot incident response tests
    public_pilot_compliance: public pilot compliance and policy tests
    public_pilot_release_guard: public pilot release boundary and GA-blocking tests
    public_pilot_access_control: public pilot access and geography control tests
    public_pilot_device_control: public pilot device binding and trust tests
    dashboard: dashboard tests
    payments: payment-domain tests
    trust: trust, replay, and proof tests
    release: release certification tests
    prr: production readiness review tests
    activation_gate: activation gate policy tests
    readiness: readiness domain policy tests
    safety: safety, recovery, and harm-prevention tests
    serial: tests that must not run in parallel

testpaths =
    afritech/tests
    tests
    afriride_system/tests
    ecosystems/afriride/tests
    novapay_agent_app/tests
