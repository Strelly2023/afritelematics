[pytest]

DJANGO_SETTINGS_MODULE = afriride_system.django_app.config.settings
python_files = tests.py test_*.py *_tests.py
pythonpath = .

# ✅ CRITICAL: disable Django plugin for AFRIPower tests
addopts =
    --strict-markers
    --disable-warnings
    --maxfail=1
    -p no:django

markers =
    fast: quick developer feedback tests
    unit: unit-level tests
    integration: integration-level tests
    contract: contract and interface tests
    governance: governance and boundary tests
    slow: slow-running tests
    mobile: mobile-app tests
    dashboard: dashboard tests
    payments: payment-domain tests
    novapay: NovaPay domain tests
    novaride: NovaRide domain tests
    identity: identity and authentication tests
    trust: trust, replay, and proof tests
    release: release certification tests
    serial: tests that must not run in parallel

testpaths =
    afritech/tests
    tests
    afriride_system/tests
    ecosystems/afriride/tests
    novapay_agent_app/tests
