[pytest]

DJANGO_SETTINGS_MODULE = afriride_system.django_app.config.settings
python_files = tests.py test_*.py *_tests.py
pythonpath = .

# ✅ CRITICAL: disable Django plugin for AFRIPower tests
addopts =
    --strict-markers
    --disable-warnings
    --maxfail=1
    -p no:django

markers =
    fast: quick developer feedback tests
    unit: unit-level tests
    integration: integration-level tests
    contract: contract and interface tests
    governance: governance and boundary tests
    private_dev: local-only developer validation for mock users, simulated payments, and sandbox identity flows
    simulated_payment: tests that exercise simulated payment providers only
    no_live_charge: tests that assert real charging is disabled
    local_only: tests that must not require networked production services
    slow: slow-running tests
    mobile: mobile-app tests
    novaride: NovaRide domain tests
    novapay: NovaPay domain tests
    novaid: NovaID domain tests
    rider: rider app tests
    driver: driver app tests
    operator: operator app tests
    consumer: NovaPay consumer tests
    agent: NovaPay agent tests
    merchant: NovaPay merchant tests
    business: NovaPay business tests
    identity: identity and authentication tests
    release_guard: release boundary and production safety tests
    apk: APK packaging and distribution tests
    smoke: fast smoke checks for private-dev and pilot readiness
    dashboard: dashboard tests
    payments: payment-domain tests
    trust: trust, replay, and proof tests
    release: release certification tests
    safety: safety, recovery, and harm-prevention tests
    serial: tests that must not run in parallel

testpaths =
    afritech/tests
    tests
    afriride_system/tests
    ecosystems/afriride/tests
    novapay_agent_app/tests
