schema_version: "1.0"

certificate_generation:
  require_clean_worktree: true
  require_exact_release_candidate_commit: true
  require_valid_candidate_manifest: true
  require_valid_evidence_manifest: true
  require_matching_product_tree_hash: true
  require_matching_repository_tree_hash: true
  require_matching_scope_id: true
  require_matching_environment: true
  reject_untracked_files: true
  reject_staged_changes: true
  reject_modified_files: true
  reject_cross_commit_evidence: true
  reject_mutable_artifacts: true
  reject_failed_or_blocked_tests: true
  reject_missing_approvals: true
