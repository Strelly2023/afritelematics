apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacodepro-notification
  namespace: novacodepro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novacodepro-notification
  template:
    metadata:
      labels:
        app: novacodepro-notification
    spec:
      serviceAccountName: novacodepro-service
      containers:
        - name: notification
          image: novacodepro-services:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "afritech.novacodepro.processes:notification_app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          envFrom:
            - configMapRef:
                name: novacodepro-config
          env:
            - name: NOVACODEPRO_NOTIFICATION_DB_PATH
              value: /var/lib/novacodepro/notification.sqlite3
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: notification-data
              mountPath: /var/lib/novacodepro
      volumes:
        - name: notification-data
          persistentVolumeClaim:
            claimName: notification-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-data
  namespace: novacodepro
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-data
  namespace: novacodepro
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacodepro-agent-worker
  namespace: novacodepro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novacodepro-agent-worker
  template:
    metadata:
      labels:
        app: novacodepro-agent-worker
    spec:
      serviceAccountName: novacodepro-service
      containers:
        - name: worker
          image: novacodepro-services:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "afritech.novacodepro.worker_main", "agent", "agents", "--db-env-var", "NOVACODEPRO_AGENT_DB_PATH"]
          envFrom:
            - configMapRef:
                name: novacodepro-config
          env:
            - name: NOVACODEPRO_AGENT_DB_PATH
              value: /var/lib/novacodepro/agent.sqlite3
          volumeMounts:
            - name: agent-data
              mountPath: /var/lib/novacodepro
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: agent-data
---
