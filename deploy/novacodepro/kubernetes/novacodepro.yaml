apiVersion: v1
kind: Namespace
metadata:
  name: novacodepro
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novacodepro-service
  namespace: novacodepro
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novacodepro-config
  namespace: novacodepro
data:
  NOVACODEPRO_EVENT_BUS_KAFKA_BROKERS: redpanda:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  NOVACODEPRO_AGENT_ASYNC_EXECUTION: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novacodepro-deny-all-egress-by-default
  namespace: novacodepro
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: novacodepro
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: novacodepro
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.1.5
          ports:
            - containerPort: 9092
          command:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 512M
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda:9092
---
apiVersion: v1
kind: Service
metadata:
  name: novacodepro-gateway
  namespace: novacodepro
spec:
  selector:
    app: novacodepro-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacodepro-gateway
  namespace: novacodepro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novacodepro-gateway
  template:
    metadata:
      labels:
        app: novacodepro-gateway
    spec:
      serviceAccountName: novacodepro-service
      containers:
        - name: gateway
          image: novacodepro-services:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "afritech.novacodepro.processes:gateway_app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          envFrom:
            - configMapRef:
                name: novacodepro-config
          env:
            - name: NOVACODEPRO_GATEWAY_DB_PATH
              value: /var/lib/novacodepro/gateway.sqlite3
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: gateway-data
              mountPath: /var/lib/novacodepro
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: gateway-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data
  namespace: novacodepro
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
