services:
  redpanda:
    image: redpandadata/redpanda:v24.1.5
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  novacodepro-gateway:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.api
    command: ["uvicorn", "afritech.novacodepro.processes:gateway_app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment:
      NOVACODEPRO_GATEWAY_DB_PATH: /var/lib/novacodepro/gateway.sqlite3
      NOVACODEPRO_EVENT_BUS_KAFKA_BROKERS: redpanda:9092
      NOVACODEPRO_AGENT_ASYNC_EXECUTION: "false"
    volumes:
      - novacodepro-gateway-data:/var/lib/novacodepro
    ports:
      - "8010:8000"

  novacodepro-solution:
    build:
      context: ../..
