services:
  afripay-api:
    build:
      context: ../..
      dockerfile: deploy/afripay/Dockerfile
    environment:
      AFRIPAY_LIVE_SETTLEMENT_ENABLED: "false"
      AFRIRIDE_DJANGO_SECRET_KEY: "local-afripay-dev-not-production"
      DATABASE_URL: "postgresql://afripay:afripay@postgres:5432/afripay"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  afripay-worker:
    build:
      context: ../..
      dockerfile: deploy/afripay/Dockerfile
    command: ["celery", "-A", "afritech.afripay.celery_app:app", "worker", "--loglevel=INFO", "--queues=afripay"]
    environment:
      AFRIPAY_LIVE_SETTLEMENT_ENABLED: "false"
      DATABASE_URL: "postgresql://afripay:afripay@postgres:5432/afripay"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afripay
      POSTGRES_USER: afripay
      POSTGRES_PASSWORD: afripay
    volumes:
      - afripay-postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - afripay-api

  grafana:
    image: grafana/grafana:11.1.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/afripay-dashboard.json:ro
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  afripay-postgres:
  grafana-data:
