apiVersion: apps/v1
kind: Deployment
metadata:
  name: afripay-api
  namespace: afripay
spec:
  replicas: 3
  selector:
    matchLabels:
      app: afripay-api
  template:
    metadata:
      labels:
        app: afripay-api
    spec:
      containers:
        - name: api
          image: afripay-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: afripay-config
            - secretRef:
                name: afripay-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
