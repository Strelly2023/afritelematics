apiVersion: apps/v1
kind: Deployment
metadata:
  name: afripay-worker
  namespace: afripay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: afripay-worker
  template:
    metadata:
      labels:
        app: afripay-worker
    spec:
      containers:
        - name: worker
          image: afripay-api:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "afritech.afripay.celery_app:app", "worker", "--loglevel=INFO", "--queues=afripay"]
          envFrom:
            - configMapRef:
                name: afripay-config
            - secretRef:
                name: afripay-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
