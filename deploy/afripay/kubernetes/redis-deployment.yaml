apiVersion: apps/v1
kind: Deployment
metadata:
  name: afripay-redis
  namespace: afripay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: afripay-redis
  template:
    metadata:
      labels:
        app: afripay-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
