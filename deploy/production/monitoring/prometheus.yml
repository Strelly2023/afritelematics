global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: afritech-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - afritech-api:8000

  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets: []

  - job_name: node_exporter
    metrics_path: /metrics
    static_configs:
      - targets: []
