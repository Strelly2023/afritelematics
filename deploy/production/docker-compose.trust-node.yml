services:
  afritech-api:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    environment:
      AFRIRIDE_DB_PATH: /var/lib/afritech/pilot_state.sqlite3
      AFRITECH_RUNTIME_ENVIRONMENT: production
      AFRITECH_AGENT_STATE_PATH: /var/lib/afritech/agents/production.sqlite3
      AFRITECH_AGENT_MINIMUM_CONFIDENCE: "0.85"
      AFRITECH_OTEL_ENABLED: ${AFRITECH_OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: afritech-api
      OTEL_SERVICE_NAMESPACE: afritech
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,service.version=0.7.0
    volumes:
      - ./secrets/eth_private_key:/run/secrets/eth_private_key:ro
      - ./secrets/afritech_private_key.pem:/run/secrets/afritech_private_key.pem:ro
      - ./secrets/afritech_public_key.pem:/run/secrets/afritech_public_key.pem:ro
      - afritech_anchor_index:/var/lib/afritech
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    command:
      - uvicorn
      - afritech.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infra

  afritech-dashboard:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.dashboard
      args:
        VITE_AFRIRIDE_API_URL: ${VITE_AFRIRIDE_API_URL:-}
        VITE_AFRIRIDE_APP_VERSION: ${VITE_AFRIRIDE_APP_VERSION:-trust-node-1}
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    expose:
      - "4173"
    depends_on:
      afritech-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra

  public-web:
    build:
      context: ../..
      dockerfile: deploy/public-web/Dockerfile
      args:
        VITE_AFRITECH_PUBLIC_API_URL: ${VITE_AFRITECH_PUBLIC_API_URL:-}
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    expose:
      - "4175"
    depends_on:
      afritech-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4175/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra

  novacodepro-portal:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.novacodepro_portal
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    expose:
      - "4174"
    depends_on:
      afritech-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4174/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/15-novacodepro-cert.envsh:/docker-entrypoint.d/15-novacodepro-cert.envsh:ro
      - ./nginx/afritechnology-platform.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./apk:/var/www/afritech-apk:ro
      - ./apk-public:/var/www/afritechnology-downloads:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      afritech-api:
        condition: service_healthy
      public-web:
        condition: service_started
      afritech-dashboard:
        condition: service_started
      novacodepro-portal:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    env_file:
      - .env.production.trust-node
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: ["certbot"]
    networks:
      - infra

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    networks:
      - infra

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - infra

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - infra

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/
    networks:
      - infra

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME:-postgresql://afritech:afritech@postgres:5432/afritech?sslmode=disable}
    networks:
      - infra

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    profiles: ["monitoring"]
    command:
      - --nginx.scrape-uri=http://nginx/stub_status
    networks:
      - infra

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["monitoring"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - infra

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/opentelemetry/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    expose:
      - "9464"
    restart: unless-stopped
    networks:
      - infra

networks:
  infra:
    external: false

volumes:
  afritech_anchor_index:
  certbot_www:
  certbot_certs:
