services:
  afritech-api:
    image: ${AFRITECH_API_IMAGE:-afritech/afritech-api:production}
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    environment:
      AFRIRIDE_DB_PATH: /var/lib/afritech/pilot_state.sqlite3
      AFRITECH_RUNTIME_ENVIRONMENT: production
      AFRITECH_AGENT_STATE_PATH: /var/lib/afritech/agents/production.sqlite3
      AFRITECH_AGENT_MINIMUM_CONFIDENCE: "0.85"
      NOVARIDE_REPLAY_DB_PATH: /var/lib/afritech/novaride-runtime-replay.sqlite3
      NOVACODEPRO_AUTH_DB_PATH: /var/lib/afritech/novacodepro-auth.sqlite3
      NOVACODEPRO_DB_PATH: /var/lib/afritech/novacodepro-platform.sqlite3
      NOVACODEPRO_DATABASE_URL: ${NOVATECH_CORE_DATABASE_URL:?NovaCodePro PostgreSQL URL required}
      NOVAPROGRAMMING_DATABASE_URL: ${NOVATECH_CORE_DATABASE_URL:?NovaProgramming PostgreSQL URL required}
      NOVAPAY_PERSISTENCE_BACKEND: postgres
      NOVAPAY_DATABASE_URL: ${NOVATECH_CORE_DATABASE_URL:?NovaPay PostgreSQL URL required}
      NOVAID_PERSISTENCE_BACKEND: postgres
      NOVAID_DATABASE_URL: ${NOVATECH_CORE_DATABASE_URL:?NovaID PostgreSQL URL required}
      NOVAID_JWT_ISSUER: ${NOVAID_JWT_ISSUER:?NovaID JWT issuer required}
      NOVAID_JWT_AUDIENCE: ${NOVAID_JWT_AUDIENCE:?NovaID JWT audience required}
      NOVAID_SIGNING_KEYS_JSON: ${NOVAID_SIGNING_KEYS_JSON:?NovaID signing key registry required}
      NOVAID_ACTIVE_SIGNING_KEY_ID: ${NOVAID_ACTIVE_SIGNING_KEY_ID:?NovaID active signing key required}
      NOVAID_TOKEN_ALGORITHM: HS256
      NOVAID_TOKEN_PEPPER: ${NOVAID_TOKEN_PEPPER:?NovaID token pepper required}
      NOVAID_REDIS_REQUIRED: "true"
      NOVAID_REDIS_URL: ${NOVAID_REDIS_URL:?NovaID Redis URL required}
      AFRITECH_OTEL_ENABLED: ${AFRITECH_OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: afritech-api
      OTEL_SERVICE_NAMESPACE: afritech
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,service.version=0.7.0
    secrets:
      - eth_private_key
      - source: afritech_private_key
        target: afritech_private_key.pem
      - source: afritech_public_key
        target: afritech_public_key.pem
    volumes:
      - afritech_anchor_index:/var/lib/afritech
    networks:
      - default
      - infrastructure
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    command:
      - uvicorn
      - afritech.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  afritech-dashboard:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.dashboard
      args:
        VITE_AFRIRIDE_API_URL: ${VITE_AFRIRIDE_API_URL:-}
        VITE_AFRIRIDE_APP_VERSION: ${VITE_AFRIRIDE_APP_VERSION:-trust-node-1}
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    expose:
      - "4173"
    depends_on:
      afritech-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  public-web:
    build:
      context: ../..
      dockerfile: deploy/public-web/Dockerfile
      args:
        VITE_AFRITECH_PUBLIC_API_URL: ${VITE_AFRITECH_PUBLIC_API_URL:-}
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    expose:
      - "4175"
    depends_on:
      afritech-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4175/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  novacodepro-portal:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.novacodepro_portal
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    expose:
      - "4174"
    depends_on:
      afritech-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4174/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - .env.production.trust-node
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/15-novacodepro-cert.envsh:/docker-entrypoint.d/15-novacodepro-cert.envsh:ro
      - ./nginx/afritechnology-platform.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${PWD}/apk:/var/www/afritech-apk:ro
      - ${PWD}/apk-public:/var/www/afritechnology-downloads:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      afritech-api:
        condition: service_healthy
      public-web:
        condition: service_started
      afritech-dashboard:
        condition: service_started
      novacodepro-portal:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    env_file:
      - .env.production.trust-node
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: ["certbot"]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME:-postgresql://afritech:afritech@postgres:5432/afritech?sslmode=disable}

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    profiles: ["monitoring"]
    command:
      - --nginx.scrape-uri=http://nginx/stub_status

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["monitoring"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/opentelemetry/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    expose:
      - "9464"
    restart: unless-stopped

volumes:
  afritech_anchor_index:
  certbot_www:
  certbot_certs:

secrets:
  eth_private_key:
    file: ./secrets/eth_private_key
  afritech_private_key:
    file: ./secrets/afritech_private_key.pem
  afritech_public_key:
    file: ./secrets/afritech_public_key.pem

networks:
  infrastructure:
    external: true
    name: ${AFRITECH_INFRA_NETWORK:-production_infra}
