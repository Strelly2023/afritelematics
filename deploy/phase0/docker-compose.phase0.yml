services:
  novaride-api:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.api
    restart: unless-stopped
    environment:
      NOVAPROGRAMMING_DATABASE_URL: postgresql://novaride:novaride@novaride-postgres:5432/novaride_phase0
      AFRITECH_JWT_SECRET: phase0-dev-secret
    ports:
      - "8000:8000"
    depends_on:
      novaride-postgres:
        condition: service_healthy
    command:
      - uvicorn
      - afritech.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  novaride-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novaride_phase0
      POSTGRES_USER: novaride
      POSTGRES_PASSWORD: novaride
    ports:
      - "5432:5432"
    volumes:
      - novaride-phase0-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaride -d novaride_phase0"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  novaride-phase0-postgres:
