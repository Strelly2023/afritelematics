name: novaride-operational

x-runtime-env: &runtime-env
  NOVARIDE_ENVIRONMENT: ${NOVARIDE_ENVIRONMENT:-staging}
  NOVARIDE_POSTGRES_DSN: postgresql://novaride:${POSTGRES_PASSWORD:?required}@postgres:5432/novaride
  NOVATECH_POSTGRES_DSN: postgresql://novaride:${POSTGRES_PASSWORD:?required}@postgres:5432/novaride
  NOVARIDE_REDIS_URL: redis://redis:6379/0
  NOVARIDE_EVENT_FABRIC_ADAPTER: kafka_outbox
  NOVARIDE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  NOVARIDE_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  NOVARIDE_REGION: ${NOVARIDE_REGION:-local-certification}
  NOVARIDE_TENANT: ${NOVARIDE_TENANT:-novaride-certification}
  NOVARIDE_PAYMENT_MODE: ${NOVARIDE_PAYMENT_MODE:-sandbox}

x-api: &api
  build:
    context: ../..
    dockerfile: deploy/staging/Dockerfile.api
  environment: *runtime-env
  depends_on:
    migrations:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  restart: unless-stopped
  networks: [novaride]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novaride
      POSTGRES_USER: novaride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaride -d novaride"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [novaride]

  migrations:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ../../afritech/novaride_runtime/persistence/migrations:/migrations:ro
    command:
      - sh
      - -ec
      - >-
        for file in /migrations/*.sql; do
          psql -v ON_ERROR_STOP=1 -h postgres -U novaride -d novaride -f "$${file}";
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [novaride]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    networks: [novaride]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes: ["kafka_data:/var/lib/kafka/data"]
    restart: unless-stopped
    networks: [novaride]

  api-a:
    <<: *api
    ports: ["8101:8000"]

  api-b:
    <<: *api
    ports: ["8102:8000"]

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  novaride:
    name: novaride-operational
