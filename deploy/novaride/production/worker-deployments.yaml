apiVersion: apps/v1
kind: Deployment
metadata:
  name: novaride-outbox-publisher
  labels:
    app: novaride-outbox-publisher
spec:
  replicas: 3
  selector:
    matchLabels:
      app: novaride-outbox-publisher
  template:
    metadata:
      labels:
        app: novaride-outbox-publisher
    spec:
      serviceAccountName: novaride-runtime
      nodeSelector:
        kubernetes.io/arch: amd64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: novaride-outbox-publisher
      containers:
        - name: worker
          image: novaride-api:2026.2
          args: ["python", "-m", "afritech.novaride_runtime.workers.outbox_worker"]
          envFrom:
            - configMapRef:
                name: novaride-runtime-config
            - secretRef:
                name: novaride-runtime-secrets
---
