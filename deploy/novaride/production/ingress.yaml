apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novaride-api
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - novaride.example.invalid
      secretName: novaride-api-tls
  rules:
    - host: novaride.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novaride-api
                port:
                  number: 80
