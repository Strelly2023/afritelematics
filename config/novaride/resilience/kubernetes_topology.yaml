apiVersion: apps/v1
kind: Deployment
metadata:
  name: novaride-api
  labels:
    app: novaride-api
spec:
  replicas: 6
  selector:
    matchLabels:
      app: novaride-api
  template:
    metadata:
      labels:
        app: novaride-api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: novaride-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: novaride-api
      containers:
        - name: api
          image: novaride-api:2026.2
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
