  - afritech/governance/rules/RULE-NOVACODEPRO-VISUAL-REGRESSION-GATE.yaml
effective_version: 1
rules:
  - Accessibility verification requires executed tools and zero critical or serious violations.
  - Executive approval requires PRR approval, evidence hash, scope, eligible role, and four-eyes validation.
  - Observability is verified only after backend ingestion confirmation.
  - Real payment activation requires independent finance, risk, provider, settlement, reconciliation, fraud, regulatory, and operations evidence.
  - PRR approval requires signed evidence package and human reviewer decisions.
  - Visual verification requires approved baselines and no unreviewed material differences.
