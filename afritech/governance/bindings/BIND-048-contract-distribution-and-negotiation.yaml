id: BIND-048
description: >
  Binds ADR-0050 and RULE-070 to runtime schema validation, version negotiation,
  schema publication, lineage, federation compatibility, SDKs, metrics, portal,
  and their tests.
bindings:
  - id: BIND-048-1
    target: afritech/platform_contracts/registry.py
    binding_type: RUNTIME_CONTRACT_REGISTRY
  - id: BIND-048-2
    target: afritech/platform_contracts/federation.py
    binding_type: FEDERATION_COMPATIBILITY
  - id: BIND-048-3
    target: afritech/api/core_platform_api.py
    binding_type: API
