    target: afritech/platform_contracts/schema-publications.json
    binding_type: SIGNED_SCHEMA_REGISTRY
  - id: BIND-048-5
    target: docs/architecture/NOVATECH_CAPABILITY_GRAPH.md
    binding_type: GENERATED_ARCHITECTURE
  - id: BIND-048-6
    target: docs/portal/NOVATECH_DEVELOPER_CONTRACT_PORTAL.md
    binding_type: DEVELOPER_PORTAL
  - id: BIND-048-7
    target: afritech/tests/platform_contracts/test_registry.py
    binding_type: TEST
  - id: BIND-048-8
    target: afritech/platform_contracts/sdk_generator.py
    binding_type: CODE_GENERATOR
linked_adr:
