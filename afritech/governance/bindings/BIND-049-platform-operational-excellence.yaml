  - {id: BIND-049-6, target: afritech/data_governance/lifecycle.py, binding_type: DATA_LIFECYCLE}
  - {id: BIND-049-7, target: afritech/ci/novatech_platform_operations_validator.py, binding_type: CI_VALIDATOR}
  - {id: BIND-049-8, target: afritech/tests/platform_operations/test_operations.py, binding_type: TEST}
  - {id: BIND-049-9, target: docs/operations/NOVATECH_PLATFORM_OPERATIONS_STANDARD.md, binding_type: OPERATIONS_STANDARD}
